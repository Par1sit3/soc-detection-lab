<!-- Wazuh agent configuration for the monitored endpoint (web01). -->
<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <agent_name>web01</agent_name>
    </enrollment>
    <!-- By default the agent restarts itself when the manager pushes shared
         config right after enrollment, and drops any logs that arrive while it
         restarts. This lab keeps all agent config in this file instead. -->
    <auto_restart>no</auto_restart>
  </client>

  <!-- Log sources -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>
  <!-- Network IDS alerts written by the Suricata sensor -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- File integrity monitoring: real-time on the places attackers persist -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>600</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/sudoers,/etc/sudoers.d,/etc/ssh</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">/root/.ssh,/home</directories>
    <directories realtime="yes" check_all="yes">/var/www/html</directories>
    <directories check_all="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <ignore>/etc/mtab</ignore>
  </syscheck>

  <!-- Security configuration assessment (CIS-style hardening score) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>

  <!-- Allow the manager to trigger containment (firewall-drop) on this host -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
